<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3c42"/>
      <stop offset="1" stop-color="#141518"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d1a"/>
      <stop offset="1" stop-color="#ffb240"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9dadf"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>
  <g filter="url(#sh)"><rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/></g>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#rim)"/>
    <!-- travel track (270deg) -->
    <path d="M 318.3 705.7 A 274 274 0 1 1 705.7 705.7" fill="none" stroke="#ffffff" stroke-opacity=".10" stroke-width="58" stroke-linecap="round"/>
    <!-- active arc glow + arc: from 225deg (bottom-left) to ~40deg past top -->
    <path d="M 318.3 705.7 A 274 274 0 1 1 688.1 302.1" fill="none" stroke="url(#arc)" stroke-width="58" stroke-linecap="round" filter="url(#glow)" opacity=".7"/>
    <path d="M 318.3 705.7 A 274 274 0 1 1 688.1 302.1" fill="none" stroke="url(#arc)" stroke-width="58" stroke-linecap="round"/>
    <!-- horn -->
    <g transform="rotate(40 512 512)" filter="url(#sh)">
      <path d="M 512 268 C 540 268 556 286 556 312 L 572 512 A 60 60 0 1 1 452 512 L 468 312 C 468 286 484 268 512 268 Z" fill="url(#horn)"/>
      <circle cx="512" cy="330" r="13" fill="#9a9ca3"/>
      <circle cx="512" cy="390" r="13" fill="#9a9ca3"/>
      <circle cx="512" cy="450" r="13" fill="#9a9ca3"/>
    </g>
    <circle cx="512" cy="512" r="34" fill="#ff6a1f"/>
    <circle cx="512" cy="512" r="13" fill="#7a2a08" opacity=".6"/>
  </g>
</svg>
